openapi: 3.0.3
info:
  title: AI 奶茶研究所 - Backend API (MVP)
  version: 1.0.0
  description: REST API surface for kiosk interactions, auth, orders, sessions and prompts.
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-DeepSeek-Key
  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        openid: { type: string }
        display_name: { type: string }
        avatar_url: { type: string }
    Product:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        price_cents: { type: integer }

paths:
  /auth/wechat:
    post:
      summary: WeChat login (server-side exchange)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
      responses:
        '200':
          description: user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /products:
    get:
      summary: list available products (with optional tag filter)
      parameters:
        - in: query
          name: tag
          schema: { type: string }
      responses:
        '200':
          description: product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

  /orders:
    post:
      summary: create simplified order (MVP: minimal cart)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId: { type: string }
                items: { type: array, items: { type: object } }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId: { type: string }

  /user/{userId}/history:
    get:
      summary: get user order & prompt history
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: history
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders: { type: array, items: { type: object } }
                  prompts: { type: array, items: { type: object } }

  /session/start:
    post:
      summary: start kiosk session (returns session_key)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                initial_scene: { type: string }
      responses:
        '201':
          description: session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_key: { type: string }

  /session/{session_key}/event:
    post:
      summary: send event to session state machine (e.g., join, action)
      parameters:
        - name: session_key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: updated session

  /duo/connect:
    post:
      summary: link two users into a relation for short-lived duo gameplay
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userA: { type: string }
                userB: { type: string }
                relationType: { type: string }
      responses:
        '201':
          description: relation created

  /prompt/divination:
    post:
      summary: business route for divination prompt (proxy to LLM)
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId: { type: string }
                contextTags: { type: array, items: { type: string } }
                candidateIds: { type: array, items: { type: string } }
      responses:
        '200':
          description: divination result
