<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clumsy Bird - 奶茶研究所</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }
    
    .game-wrapper {
      width: 100%;
      max-width: 800px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    .game-header {
      padding: 16px;
      background: linear-gradient(135deg, #7c3aed 0%, #ec4899 100%);
      color: white;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
    }
    
    .game-container {
      width: 100%;
      height: 600px;
      background: black;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .game-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    
    .loading {
      color: white;
      font-size: 18px;
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    
    .game-footer {
      padding: 12px 16px;
      background: #f9f9f9;
      font-size: 12px;
      color: #666;
      text-align: center;
      border-top: 1px solid #eee;
    }
    
    @media (max-height: 800px) {
      .game-container {
        height: 500px;
      }
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="game-header">🦆 Clumsy Bird</div>
    <div class="game-container" id="gameContainer">
      <div class="loading">🎮 游戏加载中...</div>
    </div>
    <div class="game-footer">
      由 MelonJS 引擎驱动 | GitHub: ellisonleao/clumsy-bird
    </div>
  </div>

  <script>
    // 尝试加载本地游戏文件
    function tryLoadLocalGame() {
      // 首先尝试加载本地构建的游戏 HTML
      fetch('./game.html')
        .then(response => {
          if (!response.ok) throw new Error('Local game not found')
          return response.text()
        })
        .then(html => {
          const container = document.getElementById('gameContainer')
          container.innerHTML = '<iframe srcDoc="' + encodeURIComponent(html) + '" style="width: 100%; height: 100%; border: none;"></iframe>'
        })
        .catch(() => {
          // 本地不存在则加载在线版本
          loadOnlineGame()
        })
    }

    // 加载在线游戏版本
    function loadOnlineGame() {
      const container = document.getElementById('gameContainer')
      const iframe = document.createElement('iframe')
      iframe.src = 'https://ellisonleao.github.io/clumsy-bird/'
      iframe.style.cssText = 'width: 100%; height: 100%; border: none;'
      iframe.onload = () => {
        container.innerHTML = ''
        container.appendChild(iframe)
      }
      iframe.onerror = () => {
        container.innerHTML = '<div style="color: white; text-align: center;"><p>❌ 游戏加载失败</p><p>请检查网络连接</p></div>'
      }
      container.innerHTML = ''
      container.appendChild(iframe)
    }

    // 页面加载时触发
    document.addEventListener('DOMContentLoaded', tryLoadLocalGame)
  </script>
</body>
</html>
